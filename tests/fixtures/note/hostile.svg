<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000000" height="1000000">
  <!-- Every reference points away from the drawing: next to it, the local disk, the network. -->
  <image href="secret.png" width="1000000" height="1000000"/>
  <image xlink:href="file:///etc/hostname" width="500000" height="500000"/>
  <image href="http://127.0.0.1:9/tracker.png" width="500000" height="500000"/>
  <use href="secret.svg#shape"/>
</svg>
