[workspace]
members = [
  "crates/flori-core",
  "crates/flori-store",
  "crates/flori-pipeline",
  "crates/flori-server",
  "crates/flori-runner",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"
version = "0.0.0"

[workspace.dependencies]
flori-core = { path = "crates/flori-core", version = "=0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
utoipa = "5.5.0"
uuid = { version = "1.24.1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
