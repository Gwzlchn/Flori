name: vNext CI

on:
  push:
    branches: [rust-vnext]
  pull_request:
    branches: [rust-vnext]
  workflow_dispatch:

concurrency:
  group: vnext-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Resolve diff base
        id: diff-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="$(git rev-parse HEAD^)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Check complexity budget
        env:
          BASE: ${{ steps.diff-base.outputs.base }}
        run: |
          if git show "$BASE:ROADMAP.md" | grep -Eq '^\| WP11 PDF \| 开放 \|' && \
             grep -Eq '^\| WP11 PDF \| 完成 \|' ROADMAP.md; then
            FLORI_DIFF_MAX_LINES=13500 FLORI_DIFF_MAX_FILES=125 cargo xtask diff-budget "$BASE"
          elif git show "$BASE:ROADMAP.md" | grep -Eq '^\| WP10 AI Runner \| 开放 \|' && \
             grep -Eq '^\| WP10 AI Runner \| 完成 \|' ROADMAP.md; then
            FLORI_DIFF_MAX_LINES=8000 FLORI_DIFF_MAX_FILES=70 cargo xtask diff-budget "$BASE"
          elif git show "$BASE:ROADMAP.md" | grep -Eq '^\| WP08 Job 调度 \| 开放 \|' && \
             grep -Eq '^\| WP08 Job 调度 \| 完成 \|' ROADMAP.md && \
             grep -Eq '^\| WP09 Runner 协议 \| 完成 \|' ROADMAP.md; then
            FLORI_DIFF_MAX_LINES=17000 FLORI_DIFF_MAX_FILES=95 cargo xtask diff-budget "$BASE"
          elif git show "$BASE:ROADMAP.md" | grep -Eq '^\| WP05-WP07 首批产品实现 \| 完成 \|'; then
            cargo xtask diff-budget "$BASE"
          else
            FLORI_DIFF_MAX_LINES=1800 FLORI_DIFF_MAX_FILES=20 cargo xtask diff-budget "$BASE"
          fi
      - run: cargo xtask check
      - name: Verify SQLx offline metadata
        run: |
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite
          sqlite3 "$RUNNER_TEMP/flori-sqlx.db" ".read crates/flori-store/migrations/0001_v1.sql"
          DATABASE_URL="sqlite://$RUNNER_TEMP/flori-sqlx.db" cargo sqlx prepare --check --workspace -- --all-targets
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test

  integration:
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask integration foundation

  image:
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          install: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo xtask image server
          cargo xtask image runner-media
          cargo xtask image runner-ai-qoder
          cargo xtask image runner-ai-codex
          cargo xtask image edge
