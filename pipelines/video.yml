acquire:
  executor: video.acquire
  with:
    source: $source
  tags: [download]
  retry: 1
  timeout: 30m
  artifacts:
    - { name: videos, kind: source_original, path: output/videos/*, required: true, when: on_success, max_files: 1, max_bytes: 2147483648 }
    - { name: subtitle, kind: subtitle, path: output/subtitle.srt, required: false, when: on_success, max_bytes: 16777216 }
    - { name: danmaku, kind: danmaku, path: output/danmaku.xml, required: false, when: on_success, max_bytes: 67108864 }
    - { name: parts, kind: parts_manifest, path: output/parts.json, required: true, when: on_success, max_bytes: 1048576 }
    - { name: log, kind: task_log, path: logs/task.ndjson, required: true, when: always, max_bytes: 10485760 }

transcribe:
  executor: video.transcribe
  with:
    video: $needs.acquire.videos
    subtitle: $needs.acquire.subtitle
  needs: [acquire]
  tags: [media]
  retry: 1
  timeout: 2h
  artifacts:
    - { name: transcript, kind: transcript, path: output/transcript.json, required: true, when: on_success, max_bytes: 67108864 }
    - { name: log, kind: task_log, path: logs/task.ndjson, required: true, when: always, max_bytes: 10485760 }

frames:
  executor: video.frames
  with:
    video: $needs.acquire.videos
    transcript: $needs.transcribe.transcript
  needs: [acquire, transcribe]
  tags: [media]
  retry: 1
  timeout: 1h
  artifacts:
    - { name: frames, kind: keyframe, path: output/frames/*, required: true, when: on_success, max_files: 12, max_bytes: 20971520 }
    - { name: log, kind: task_log, path: logs/task.ndjson, required: true, when: always, max_bytes: 10485760 }

mechanical:
  executor: video.mechanical_note
  with:
    transcript: $needs.transcribe.transcript
    frames: $needs.frames.frames
  needs: [transcribe, frames]
  tags: [media]
  retry: 1
  timeout: 10m
  artifacts:
    - { name: mechanical_note, kind: mechanical_note, path: output/mechanical-note.md, required: true, when: on_success, max_bytes: 67108864 }
    - { name: log, kind: task_log, path: logs/task.ndjson, required: true, when: always, max_bytes: 10485760 }

note:
  executor: ai.video_note
  with:
    transcript: $needs.transcribe.transcript
    mechanical_note: $needs.mechanical.mechanical_note
    frames: $needs.frames.frames
    prompt: $prompts.video_note
  needs: [transcribe, frames, mechanical]
  tags: [ai]
  timeout: 30m
  artifacts:
    - { name: smart_note, kind: smart_note, path: output/smart-note.md, required: true, when: on_success, max_bytes: 10485760 }
    - { name: summary, kind: summary, path: output/summary.md, required: true, when: on_success, max_bytes: 10485760 }
    - { name: terms, kind: terms, path: output/terms.json, required: true, when: on_success, max_bytes: 10485760 }
    - { name: audit, kind: ai_audit, path: logs/ai-audit.json, required: true, when: always, max_bytes: 1048576 }
    - { name: log, kind: task_log, path: logs/task.ndjson, required: true, when: always, max_bytes: 10485760 }

validate:
  executor: core.validate
  with:
    source: $needs.frames
    notes: $needs.note
  needs: [frames, note]
  timeout: 2m
  artifacts:
    - { name: evidence, kind: evidence, path: output/evidence.json, required: true, when: on_success, max_bytes: 10485760 }

publish:
  executor: core.publish
  with:
    validated: $needs.validate.evidence
  needs: [validate]
  timeout: 2m
  artifacts: []
