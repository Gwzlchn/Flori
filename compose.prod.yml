services:
  edge:
    image: ${FLORI_EDGE_IMAGE:-flori-edge:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: edge
    ports:
      - "${FLORI_EDGE_PORT:-8080}:80"
    restart: unless-stopped

  server:
    image: ${FLORI_SERVER_IMAGE:-flori-server:local}
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      FLORI_DATA_ROOT: /data
    volumes:
      - ${FLORI_DATA_DIR:-./data}:/data

  runner-media:
    image: ${FLORI_RUNNER_MEDIA_IMAGE:-flori-runner-media:local}
    build:
      context: .
      dockerfile: docker/runner-media.Dockerfile
    environment:
      FLORI_SERVER_URL: ${FLORI_SERVER_URL:-}
      FLORI_RUNNER_TOKEN: ${FLORI_RUNNER_TOKEN_MEDIA:-}
      FLORI_RUNNER_SPOOL_DIR: /var/lib/flori-runner/spool
    volumes:
      - runner-media-spool:/var/lib/flori-runner
    profiles: [media]

  runner-ai-qoder:
    image: ${FLORI_RUNNER_QODER_IMAGE:-flori-runner-ai-qoder:local}
    build:
      context: .
      dockerfile: docker/runner-ai-qoder.Dockerfile
      args:
        HTTP_PROXY: ${FLORI_QODER_BUILD_PROXY:-}
        HTTPS_PROXY: ${FLORI_QODER_BUILD_PROXY:-}
    environment:
      FLORI_SERVER_URL: ${FLORI_SERVER_URL:-}
      FLORI_RUNNER_TOKEN: ${FLORI_RUNNER_TOKEN_QODER:-}
      FLORI_RUNNER_MODEL: ${FLORI_RUNNER_QODER_MODEL:-}
      FLORI_RUNNER_EFFORT: ${FLORI_RUNNER_QODER_EFFORT:-}
      FLORI_RUNNER_SPOOL_DIR: /var/lib/flori-runner/spool
      FLORI_QODER_PROXY_URL: ${FLORI_QODER_PROXY_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Use a deployment-only copy owned by UID/GID 65532 with 0700 dirs and 0600 files.
      - type: bind
        source: ${FLORI_QODER_AUTH_DIR:-./runner-auth/qoder}
        target: /home/flori/.qoder/.auth
        read_only: true
        bind:
          create_host_path: false
      - runner-ai-qoder-spool:/var/lib/flori-runner
    profiles: [ai-qoder]

  runner-ai-codex:
    image: ${FLORI_RUNNER_CODEX_IMAGE:-flori-runner-ai-codex:local}
    build:
      context: .
      dockerfile: docker/runner-ai-codex.Dockerfile
      args:
        HTTP_PROXY: ${FLORI_CODEX_BUILD_PROXY:-}
        HTTPS_PROXY: ${FLORI_CODEX_BUILD_PROXY:-}
    environment:
      FLORI_SERVER_URL: ${FLORI_SERVER_URL:-}
      FLORI_RUNNER_TOKEN: ${FLORI_RUNNER_TOKEN_CODEX:-}
      FLORI_RUNNER_MODEL: ${FLORI_RUNNER_CODEX_MODEL:-}
      FLORI_RUNNER_EFFORT: ${FLORI_RUNNER_CODEX_EFFORT:-}
      FLORI_RUNNER_SPOOL_DIR: /var/lib/flori-runner/spool
      FLORI_CODEX_PROXY_URL: ${FLORI_CODEX_PROXY_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${FLORI_CODEX_AUTH_FILE:-./runner-auth/codex/auth.json}
        target: /home/flori/.codex/auth.json
        read_only: true
        bind:
          create_host_path: false
      - runner-ai-codex-spool:/var/lib/flori-runner
    profiles: [ai-codex]

volumes:
  runner-media-spool:
  runner-ai-qoder-spool:
  runner-ai-codex-spool:
