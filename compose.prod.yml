services:
  edge:
    image: ${FLORI_EDGE_IMAGE:-flori-edge:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: edge
    ports:
      - "${FLORI_EDGE_PORT:-8080}:80"
    restart: unless-stopped

  server:
    image: ${FLORI_SERVER_IMAGE:-flori-server:local}
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      FLORI_DATA_ROOT: /data
    volumes:
      - ${FLORI_DATA_DIR:-./data}:/data

  runner-media:
    image: ${FLORI_RUNNER_MEDIA_IMAGE:-flori-runner-media:local}
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      target: runner-media
    environment:
      FLORI_SERVER_URL: ${FLORI_SERVER_URL:-http://edge}
      FLORI_RUNNER_TOKEN: ${FLORI_RUNNER_TOKEN_MEDIA:-}
    profiles: [media]

  runner-ai-qoder:
    image: ${FLORI_RUNNER_QODER_IMAGE:-flori-runner-ai-qoder:local}
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      target: runner-ai-qoder
    environment:
      FLORI_SERVER_URL: ${FLORI_SERVER_URL:?set FLORI_SERVER_URL to the public HTTPS endpoint}
      FLORI_RUNNER_TOKEN: ${FLORI_RUNNER_TOKEN_QODER:-}
      FLORI_RUNNER_MODEL: ${FLORI_RUNNER_QODER_MODEL:-}
      FLORI_RUNNER_EFFORT: ${FLORI_RUNNER_QODER_EFFORT:-}
      FLORI_RUNNER_SPOOL_DIR: /var/lib/flori-runner/spool
    volumes:
      - type: bind
        source: ${FLORI_QODER_AUTH_DIR:-./data/runner-auth/qoder}
        target: /home/flori/.qoder/.auth
        read_only: true
        bind:
          create_host_path: false
      - runner-ai-qoder-spool:/var/lib/flori-runner
    profiles: [ai-qoder]

  runner-ai-codex:
    image: ${FLORI_RUNNER_CODEX_IMAGE:-flori-runner-ai-codex:local}
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      target: runner-ai-codex
    environment:
      FLORI_SERVER_URL: ${FLORI_SERVER_URL:?set FLORI_SERVER_URL to the public HTTPS endpoint}
      FLORI_RUNNER_TOKEN: ${FLORI_RUNNER_TOKEN_CODEX:-}
      FLORI_RUNNER_MODEL: ${FLORI_RUNNER_CODEX_MODEL:-}
      FLORI_RUNNER_EFFORT: ${FLORI_RUNNER_CODEX_EFFORT:-}
      FLORI_RUNNER_SPOOL_DIR: /var/lib/flori-runner/spool
    volumes:
      - type: bind
        source: ${FLORI_CODEX_AUTH_FILE:-./data/runner-auth/codex/auth.json}
        target: /home/flori/.codex/auth.json
        read_only: true
        bind:
          create_host_path: false
      - runner-ai-codex-spool:/var/lib/flori-runner
    profiles: [ai-codex]

volumes:
  runner-ai-qoder-spool:
  runner-ai-codex-spool:
