# 显式项目名,隔离命名空间(避免回退目录名与生产/dev 撞卷名)。
name: flori-integration

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no

  api:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: api
    command: python -m api.main
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./shared:/app/shared
      - ./api:/app/api
      - ./steps:/app/steps
      - ./configs:/app/configs
      - integration-data:/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - CONFIG_DIR=/app/configs
      - DRY_RUN=${DRY_RUN:-0}
      - API_ALLOW_NO_AUTH=1   # 集成测试栈:无 token 放行
      # app_credentials at-rest 加密的 Fernet key。空=明文落库;设 key 即加密。
      - FLORI_SECRET_KEY=${FLORI_SECRET_KEY:-}
    depends_on:
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: scheduler
    command: python -m scheduler.main
    volumes:
      - ./shared:/app/shared
      - ./scheduler:/app/scheduler
      - ./steps:/app/steps
      - ./configs:/app/configs
      - integration-data:/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - CONFIG_DIR=/app/configs
    depends_on:
      - redis

  worker-cpu:
    init: true
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: worker
      args:
        INSTALL_CLAUDE_CODE: "0"
        INSTALL_QODER_CLI: "0"
        INSTALL_CODEX_CLI: "0"
    command: python -m worker.main --pools cpu
    volumes:
      - ./shared:/app/shared
      - ./worker:/app/worker
      - ./steps:/app/steps
      - ./configs:/app/configs
      - integration-data:/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - CONFIG_DIR=/app/configs
      - DRY_RUN=${DRY_RUN:-0}
      - WORKER_NAME=integration-cpu
    depends_on:
      - redis

  worker-io:
    init: true
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: worker
      args:
        INSTALL_CLAUDE_CODE: "0"
        INSTALL_QODER_CLI: "0"
        INSTALL_CODEX_CLI: "0"
    command: python -m worker.main --pools io
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./shared:/app/shared
      - ./worker:/app/worker
      - ./steps:/app/steps
      - ./configs:/app/configs
      - integration-data:/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - CONFIG_DIR=/app/configs
      - DRY_RUN=${DRY_RUN:-0}
      - WORKER_NAME=integration-io
      - HTTPS_PROXY=http://host.docker.internal:11081
      - HTTP_PROXY=http://host.docker.internal:11081
    depends_on:
      - redis

  worker-ai:
    init: true
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: worker
      args:
        INSTALL_CLAUDE_CODE: "0"
        INSTALL_QODER_CLI: "0"
        INSTALL_CODEX_CLI: "0"
    # DRY_RUN 不调用 Claude CLI,但入口能力门仍需覆盖生产路由标签。受保护标签不可手填
    # (worker 会拒绝启动),合成栈按生产同一探测路径自证:落 claude 存根二进制 + 非空凭证,
    # FLORI_CLI_PROVIDER 显式绑定 claude-cli,auto_discover_tags 据此打出
    # claude-cli/read/websearch/vision,不从同机其它凭证推断第二种 CLI。
    command:
      - sh
      - -c
      - |
        mkdir -p "$${HOME:-/root}/.claude"
        printf synthetic > "$${HOME:-/root}/.claude/.credentials.json"
        printf '#!/bin/sh\necho 0.0.0-synthetic\n' > /usr/local/bin/claude
        chmod 0755 /usr/local/bin/claude
        exec python -m worker.main --pools ai
    volumes:
      - ./shared:/app/shared
      - ./worker:/app/worker
      - ./steps:/app/steps
      - ./configs:/app/configs
      - integration-data:/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - CONFIG_DIR=/app/configs
      - FLORI_CLI_PROVIDER=claude-cli
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - DRY_RUN=${DRY_RUN:-0}
      - WORKER_NAME=integration-ai
    depends_on:
      - redis

volumes:
  integration-data:
